<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="Cleveland Sanat Müzesi koleksiyonundaki tabloları keşfet.">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WallArt">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Açılışta gereken bağlantılar ve dosyalar Flutter yüklenirken hazırlanır -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://openaccess-api.clevelandart.org" crossorigin>
  <link rel="preconnect" href="https://openaccess-cdn.clevelandart.org">
  <link rel="preload" href="main.dart.js" as="script">

  <title>WallArt</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { background: #fff; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #splash div { width: 40px; height: 40px; border-radius: 50%;
      border: 4px solid #0002; border-top-color: #000; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      body { background: #000; }
      #splash div { border-color: #fff2; border-top-color: #fff; }
    }
  </style>
</head>
<body>
  <div id="splash"><div></div></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
